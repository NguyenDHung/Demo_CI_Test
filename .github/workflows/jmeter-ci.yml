name: JMeter Performance CI Pipeline

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Chọn kịch bản test cần chạy'
        required: true
        default: 'scenarios/TS01_Auth_Load.jmx'
        type: choice
        options:
          - 'scenarios/TS01_Auth_Load.jmx'
          - 'scenarios/TS02_Upload_File.jmx'
          - 'scenarios/TS03_Search_Query_Load.jmx'
          - 'scenarios/TS04_Collaboration_Flow.jmx'
          - 'scenarios/TS05_System_Stress.jmx'
      base_url:
        description: 'Target Host (hoặc IP)'
        required: true
        default: 'host.docker.internal'
      port:
        description: 'Target Port'
        required: true
        default: '7157'
      protocol:
        description: 'Protocol (http / https)'
        required: true
        default: 'https'
        type: choice
        options:
          - 'https'
          - 'http'

jobs:
  run-jmeter-test:
    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Prepare Results Directory
        shell: powershell
        run: |
          if (Test-Path -Path "./results/html-report") { 
            Remove-Item -Recurse -Force "./results/html-report" 
          }
          if (Test-Path -Path "./results/result.jtl") { 
            Remove-Item -Force "./results/result.jtl" 
          }
          New-Item -ItemType Directory -Force -Path "./results/html-report"

      - name: Pre-create Dynamic CSV Files
        shell: powershell
        run: |
          if (-not (Test-Path -Path "./data")) {
            New-Item -ItemType Directory -Force -Path "./data"
          }
          if (-not (Test-Path -Path "./data/collaboration_pairs.csv")) {
            New-Item -ItemType File -Force -Path "./data/collaboration_pairs.csv"
          }

      - name: Create JMeter Runner Script
        shell: bash
        run: |
          # Sinh ra một file shell script để Docker tự chạy, tránh lỗi đường dẫn và lỗi của PowerShell
          cat << 'EOF' > run-jmeter.sh
          #!/bin/sh
          set -e
          
          echo "=== TIM KIEM THU MUC JMETER ==="
          JMETER_BIN=$(which jmeter)
          JMETER_HOME=$(dirname $(dirname "$JMETER_BIN"))
          echo "JMeter Home duoc tim thay tai: $JMETER_HOME"
          
          echo "=== TAI VA CAI DAT JMETER PLUGINS MANAGER ==="
          wget -q https://repo1.maven.org/maven2/kg/apc/jmeter-plugins-manager/1.10/jmeter-plugins-manager-1.10.jar -P "$JMETER_HOME/lib/ext/" || true
          wget -q https://repo1.maven.org/maven2/kg/apc/cmdrunner/2.3/cmdrunner-2.3.jar -P "$JMETER_HOME/lib/" || true
          java -cp "$JMETER_HOME/lib/ext/jmeter-plugins-manager-1.10.jar" org.jmeterplugins.repository.PluginManagerCMDInstaller || true
          
          if [ "$SCENARIO_FILE" = "TS05_System_Stress.jmx" ]; then
            echo "=== CAI DAT ULTIMATE THREAD GROUP ==="
            "$JMETER_HOME/bin/PluginsManagerCMD.sh" install jpgc-casutg || true
          fi
          
          echo "=== KHOI CHAY JMETER ==="
          jmeter -n -t "scenarios/$SCENARIO_FILE" -JBASE_URL="$BASE_URL" -JPORT="$PORT" -JPROTOCOL="$PROTOCOL" -l results/result.jtl -e -o results/html-report
          EOF
          chmod +x run-jmeter.sh

      - name: Execute JMeter in Docker Container
        shell: powershell
        run: |
          $scenario = "${{ github.event.inputs.scenario }}"
          $baseUrl = "${{ github.event.inputs.base_url }}"
          $port = "${{ github.event.inputs.port }}"
          $protocol = "${{ github.event.inputs.protocol }}"
          $scenarioFile = [System.IO.Path]::GetFileName($scenario)

          # Khởi chạy Docker và đẩy các biến môi trường vào cho file script run-jmeter.sh xử lý
          docker run --rm `
            --add-host=host.docker.internal:host-gateway `
            -v "${{ github.workspace }}:/workspace" `
            -w /workspace `
            -e SCENARIO_FILE="$scenarioFile" `
            -e BASE_URL="$baseUrl" `
            -e PORT="$port" `
            -e PROTOCOL="$protocol" `
            --entrypoint /bin/sh `
            justb4/jmeter:5.5 `
            /workspace/run-jmeter.sh

      - name: Upload HTML Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JMeter-Report-${{ github.run_number }}
          path: results/html-report/