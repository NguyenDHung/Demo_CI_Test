name: JMeter Performance CI Pipeline

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Chọn kịch bản test cần chạy'
        required: true
        default: 'scenarios/TS01_Auth_Load.jmx'
        type: choice
        options:
          - 'scenarios/TS01_Auth_Load.jmx'
          - 'scenarios/TS02_Upload_File.jmx'
          - 'scenarios/TS03_Search_Query_Load.jmx'
          - 'scenarios/TS04_Collaboration_Flow.jmx'
          - 'scenarios/TS05_System_Stress.jmx'
      base_url:
        description: 'Target Host (hoặc IP)'
        required: true
        default: 'host.docker.internal'
      port:
        description: 'Target Port'
        required: true
        default: '7157'
      protocol:
        description: 'Protocol (http / https)'
        required: true
        default: 'https'
        type: choice
        options:
          - 'https'
          - 'http'

jobs:
  run-jmeter-test:
    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Prepare Results Directory
        shell: powershell
        run: |
          if (Test-Path -Path "./results/html-report") { 
            Remove-Item -Recurse -Force "./results/html-report" 
          }
          if (Test-Path -Path "./results/result.jtl") { 
            Remove-Item -Force "./results/result.jtl" 
          }
          New-Item -ItemType Directory -Force -Path "./results/html-report"

      - name: Pre-create Dynamic CSV Files
        shell: powershell
        run: |
          # Bắt buộc tạo trước file để tránh lỗi FileNotFoundException ngầm của JMeter lúc khởi động kịch bản TS04 và TS05
          if (-not (Test-Path -Path "./data")) {
            New-Item -ItemType Directory -Force -Path "./data"
          }
          if (-not (Test-Path -Path "./data/collaboration_pairs.csv")) {
            New-Item -ItemType File -Force -Path "./data/collaboration_pairs.csv"
          }

      - name: Download Plugins (Only for TS05)
        if: github.event.inputs.scenario == 'scenarios/TS05_System_Stress.jmx'
        shell: powershell
        run: |
          if (-not (Test-Path -Path "./plugins")) {
            New-Item -ItemType Directory -Force -Path ./plugins
          }
          Write-Host "Downloading Ultimate Thread Group plugin for TS05..."
          Invoke-WebRequest -Uri "https://repo1.maven.org/maven2/kg/apc/jmeter-plugins-casutg/2.10/jmeter-plugins-casutg-2.10.jar" -OutFile "./plugins/jmeter-plugins-casutg-2.10.jar"
          Invoke-WebRequest -Uri "https://repo1.maven.org/maven2/kg/apc/jmeter-plugins-cmn-jmeter/0.7/jmeter-plugins-cmn-jmeter-0.7.jar" -OutFile "./plugins/jmeter-plugins-cmn-jmeter-0.7.jar"
          Write-Host "Plugins downloaded successfully."

      - name: Execute JMeter in Docker Container
        shell: powershell
        run: |
          $scenario = "${{ github.event.inputs.scenario }}"
          $baseUrl = "${{ github.event.inputs.base_url }}"
          $port = "${{ github.event.inputs.port }}"
          $protocol = "${{ github.event.inputs.protocol }}"

          # Đảm bảo mount volume không bị lỗi khi chạy các kịch bản khác (TS01-TS04) không tải plugin
          if (-not (Test-Path -Path "./plugins")) {
            New-Item -ItemType Directory -Force -Path ./plugins
          }

          $scenarioFile = [System.IO.Path]::GetFileName($scenario)

          # Sử dụng entrypoint /bin/sh để copy các plugin vào lõi JMeter y hệt như cách làm trên GitLab
          docker run --rm `
            --add-host=host.docker.internal:host-gateway `
            -v "${{ github.workspace }}:/workspace" `
            -w /workspace/scenarios `
            --entrypoint /bin/sh `
            egaillardon/jmeter-plugins `
            -c "cp /workspace/plugins/*.jar /opt/jmeter/lib/ext/ 2>/dev/null || true; jmeter -n -t $scenarioFile -JBASE_URL=$baseUrl -JPORT=$port -JPROTOCOL=$protocol -l ../results/result.jtl -e -o ../results/html-report"

      - name: Upload HTML Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JMeter-Report-${{ github.run_number }}
          path: results/html-report/