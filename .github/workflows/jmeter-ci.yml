name: JMeter Performance CI Pipeline
run-name: "[${{ github.event.inputs.scenario }}] -${{ github.event.inputs.login_user }} VUs by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Chọn kịch bản test cần chạy'
        required: true
        default: 'scenarios/TS01_Auth_Load.jmx'
        type: choice
        options:
          - 'scenarios/TS01_Auth_Load.jmx'
          - 'scenarios/TS02_Upload_File.jmx'
          - 'scenarios/TS03_Search_Query_Load.jmx'
          - 'scenarios/TS04_Collaboration_Flow.jmx'
          - 'scenarios/TS05_System_Stress.jmx'
          - 'scenarios/TS06_Upload_File_Stress.jmx'
      login_user:
        description: '[TS01] Số lượng Virtual Users (LOGIN_USER)'
        required: true
        default: '50'
      login_ramp_up:
        description: '[TS01] Thời gian Ramp-up tính theo giây (LOGIN_RAMP_UP)'
        required: true
        default: '30'
      login_duration:
        description: '[TS01] Thời gian chạy test tính theo giây (LOGIN_DURATION)'
        required: true
        default: '180'

      # --- Cấu hình cho TS02 (Upload File) ---
      upload_user:
        description: '[TS02] Số lượng Virtual Users (UPLOAD_USER)'
        required: false
        default: '20'
      upload_ramp_up:
        description: '[TS02] Thời gian Ramp-up giây (UPLOAD_RAMP_UP)'
        required: false
        default: '20'
      upload_duration:
        description: '[TS02] Thời gian chạy giây (UPLOAD_DURATION)'
        required: false
        default: '180'

      base_url:
        description: 'Target Host (hoặc IP)'
        required: true
        default: 'host.docker.internal'
      port:
        description: 'Target Port'
        required: true
        default: '7157'
      protocol:
        description: 'Protocol (http / https)'
        required: true
        default: 'https'
        type: choice
        options:
          - 'https'
          - 'http'

jobs:
  run-jmeter-test:
    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Prepare Results Directory
        shell: powershell
        run: |
          # 1. Dọn dẹp nội dung cũ bên trong kết quả nếu có
          if (Test-Path -Path "./results/html-report") { 
            Remove-Item -Recurse -Force "./results/html-report" 
          }
          if (Test-Path -Path "./results/result.jtl") { 
            Remove-Item -Force "./results/result.jtl" 
          }
          # 2. Tạo sẵn thư mục cha ./results (NHƯNG KHÔNG TẠO html-report để JMeter tự sinh)
          if (-not (Test-Path -Path "./results")) {
            New-Item -ItemType Directory -Force -Path "./results"
          }

          # 3. Ghi trực tiếp các biến cấu hình vào run.properties bằng Here-String (không dùng foreach)
          $content = @"
          jmeter.reportgenerator.exporter.html.series_filter=^TX_.*$
          BASE_URL=${{ github.event.inputs.base_url }}
          PORT=${{ github.event.inputs.port }}
          PROTOCOL=${{ github.event.inputs.protocol }}
          LOGIN_USER=${{ github.event.inputs.login_user }}
          LOGIN_RAMP_UP=${{ github.event.inputs.login_ramp_up }}
          LOGIN_DURATION=${{ github.event.inputs.login_duration }}
          UPLOAD_USER=${{ github.event.inputs.upload_user }}
          UPLOAD_RAMP_UP=${{ github.event.inputs.upload_ramp_up }}
          UPLOAD_DURATION=${{ github.event.inputs.upload_duration }}
          "@

          Set-Content -Path "./run.properties" -Value $content

      - name: Download Plugins (TS05 & TS06 only)
        if: contains(github.event.inputs.scenario, 'TS05') || contains(github.event.inputs.scenario, 'TS06')
        shell: powershell
        run: |
          if (-not (Test-Path -Path "./plugins")) {
            New-Item -ItemType Directory -Force -Path "./plugins"
          }
          if (-not (Test-Path -Path "./plugins/jmeter-plugins-casutg.jar")) {
            Invoke-WebRequest -Uri "https://repo1.maven.org/maven2/kg/apc/jmeter-plugins-casutg/2.10/jmeter-plugins-casutg-2.10.jar" -OutFile "./plugins/jmeter-plugins-casutg.jar"
          }
          if (-not (Test-Path -Path "./plugins/jmeter-plugins-cmn.jar")) {
            Invoke-WebRequest -Uri "https://repo1.maven.org/maven2/kg/apc/jmeter-plugins-cmn-jmeter/0.7/jmeter-plugins-cmn-jmeter-0.7.jar" -OutFile "./plugins/jmeter-plugins-cmn.jar"
          }

      - name: Execute JMeter in Docker Container
        shell: powershell
        run: |
          $scenario = "${{ github.event.inputs.scenario }}"
          $scenarioFile = [System.IO.Path]::GetFileName($scenario)
          $scenarioName = [System.IO.Path]::GetFileNameWithoutExtension($scenario)
          echo "SCENARIO_NAME=$scenarioName" >> $env:GITHUB_ENV

          # Mount plugin nếu có
          $pluginMounts = @()
          if (Test-Path -Path "${{ github.workspace }}/plugins/jmeter-plugins-casutg.jar") {
            $pluginMounts += "-v", "${{ github.workspace }}/plugins/jmeter-plugins-casutg.jar:/opt/apache-jmeter-5.5/lib/ext/jmeter-plugins-casutg.jar"
          }
          if (Test-Path -Path "${{ github.workspace }}/plugins/jmeter-plugins-cmn.jar") {
            $pluginMounts += "-v", "${{ github.workspace }}/plugins/jmeter-plugins-cmn.jar:/opt/apache-jmeter-5.5/lib/ext/jmeter-plugins-cmn.jar"
          }

          # Gọi Docker ngắn gọn với cờ -q
          docker run --rm `
            --add-host=host.docker.internal:host-gateway `
            -v "${{ github.workspace }}:/workspace" `
            $pluginMounts `
            -w /workspace/scenarios `
            justb4/jmeter:5.5 `
            -n -t "$scenarioFile" `
            -q "/workspace/run.properties" `
            -l "../results/result.jtl" `
            -e -o "../results/html-report"

      - name: Upload HTML Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JMeter-Report-${{ github.run_number }}
          path: results/html-report/